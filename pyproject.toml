[project]
name = "ultimatedesign"
version = "2.1.0"
description = "AI-powered urban design and micro-renewal planning decision support platform"
requires-python = ">=3.12"
license = {text = "Academic"}
authors = [{name = "Chain813"}]
readme = "README.md"
keywords = ["urban-design", "aigc", "city-planning", "streamlit", "stable-diffusion"]

dependencies = [
    "streamlit>=1.55",
    "pandas>=2.3",
    "pydeck>=0.9",
    "openpyxl>=3.1",
    "requests>=2.32",
    "plotly>=6.6",
    "pillow>=11.3",
    "numpy>=1.26",
    "jieba>=0.42",
    "beautifulsoup4>=4.12",
    "folium>=0.20",
    "streamlit-folium>=0.22",
    "markitdown>=0.0.1a3",
    "mammoth>=1.8",
    "python-docx>=1.1",
    "lxml>=5.3",
    "pdfminer.six>=20240706",
    "pypdf>=5.0",
    "pymupdf>=1.24",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "pywebview>=6.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "ruff>=0.15",
    "pre-commit>=3.8",
]
gis = [
    "geopandas>=1.1",
    "shapely>=2.0",
    "pyproj>=3.6",
]
gpu = [
    "torch>=2.5",
    "torchvision>=0.20",
    "transformers>=4.40",
]
browser = [
    "selenium>=4.25",
    "webdriver-manager>=4.0",
]
all = [
    "ultimatedesign[dev,gis,gpu,browser]",
]

[project.scripts]
ultimatedesign = "app:main"

# ── Tool configurations ──────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short -n auto"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E9", "F63", "F7", "F82",   # Fatal errors
    "I",                          # isort — import ordering
    "UP",                         # pyupgrade — modern Python syntax
    "B",                          # flake8-bugbear — common pitfalls
    "SIM",                        # flake8-simplify — code simplification
    "RUF",                        # Ruff-specific rules
]
ignore = [
    "B008",   # Streamlit uses function calls in default args by design
    "B905",   # `zip()` without an explicit `strict=` parameter
    "UP015",  # Unnecessary open mode parameters — keep explicit for readability
    "RUF001", "RUF002", "RUF003", # Allow ambiguous unicode characters (Chinese punctuations)
]

[tool.ruff.lint.per-file-ignores]
# Lazy import pattern: __all__ names resolved via __getattr__ at runtime
"src/engines/engine_registry.py" = ["F822"]
"src/engines/__init__.py" = ["F822"]
