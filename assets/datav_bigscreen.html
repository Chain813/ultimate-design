<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>数据大屏 — UltimateDESIGN</title>
<script src="https://unpkg.com/deck.gl@8.9.0/dist.min.js"></script>
<script src="https://unpkg.com/maplibre-gl@3.3.0/dist/maplibre-gl.js"></script>
<link href="https://unpkg.com/maplibre-gl@3.3.0/dist/maplibre-gl.css" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f7;overflow:hidden;color:#1d1d1f}

/* ── Grid Layout ── */
.dv-root{display:grid;grid-template-columns:320px 1fr 320px;grid-template-rows:64px 1fr 72px;height:100vh;width:100vw;gap:0;background:#f5f5f7}
.dv-header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:#fff;border-bottom:1px solid rgba(0,0,0,.06);position:relative;overflow:hidden}
.dv-left{display:flex;flex-direction:column;gap:12px;padding:12px;overflow:hidden}
.dv-center{position:relative;overflow:hidden;border-radius:0}
.dv-right{display:flex;flex-direction:column;gap:12px;padding:12px;overflow:hidden}
.dv-footer{grid-column:1/-1;display:flex;align-items:center;justify-content:space-around;padding:0 24px;background:#fff;border-top:1px solid rgba(0,0,0,.06)}

/* ── Header ── */
.dv-header h1{font-size:17px;font-weight:800;letter-spacing:-.02em;color:#1d1d1f}
.dv-header-sub{font-size:11px;color:#86868b;font-weight:600}
.dv-header-right{display:flex;align-items:center;gap:16px}
.dv-header-badge{background:rgba(0,113,227,.08);border:1px solid rgba(0,113,227,.15);color:#0071e3;font-size:10px;font-weight:800;padding:4px 10px;border-radius:20px;letter-spacing:.06em}
.dv-clock{font-size:13px;font-weight:700;color:#1d1d1f;font-variant-numeric:tabular-nums}

/* Scan line */
.dv-header::after{content:'';position:absolute;bottom:0;left:0;width:100%;height:2px;background:linear-gradient(90deg,transparent,rgba(0,113,227,.25),transparent);animation:scanH 4s linear infinite}
@keyframes scanH{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}

/* ── Panel Cards ── */
.dv-card{background:#fff;border:1px solid rgba(0,0,0,.06);border-radius:14px;padding:14px 16px;flex:1;min-height:0;overflow:hidden;position:relative;box-shadow:0 2px 8px rgba(0,0,0,.02);transition:border-color .3s}
.dv-card:hover{border-color:rgba(0,113,227,.2)}
.dv-card-title{font-size:11px;font-weight:800;color:#86868b;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.dv-card-title::before{content:'';width:3px;height:12px;border-radius:2px;background:#0071e3}

/* ── KPI Metric ── */
.dv-kpi{display:flex;align-items:baseline;gap:4px}
.dv-kpi-value{font-size:28px;font-weight:900;color:#0071e3;line-height:1;font-variant-numeric:tabular-nums}
.dv-kpi-unit{font-size:12px;font-weight:600;color:#86868b}
.dv-kpi-label{font-size:11px;color:#48484a;margin-top:4px;font-weight:500}
.dv-kpi-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ── Footer KPIs ── */
.dv-footer-item{text-align:center}
.dv-footer-val{font-size:20px;font-weight:900;color:#0071e3;font-variant-numeric:tabular-nums}
.dv-footer-label{font-size:10px;color:#86868b;font-weight:700;letter-spacing:.04em;margin-top:2px}
.dv-footer-sep{width:1px;height:36px;background:rgba(0,0,0,.06)}

/* ── Chart containers ── */
.dv-chart{width:100%;flex:1;min-height:0}

/* ── Scroll List ── */
.dv-scroll-wrap{flex:1;overflow:hidden;position:relative;min-height:0}
.dv-scroll-inner{animation:scrollUp 30s linear infinite}
.dv-scroll-wrap:hover .dv-scroll-inner{animation-play-state:paused}
@keyframes scrollUp{0%{transform:translateY(0)}100%{transform:translateY(-50%)}}
.dv-scroll-row{display:flex;align-items:center;padding:5px 0;border-bottom:1px solid rgba(0,0,0,.04);font-size:11px;gap:8px}
.dv-scroll-idx{width:20px;height:20px;border-radius:6px;background:rgba(0,113,227,.08);color:#0071e3;font-weight:800;font-size:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.dv-scroll-name{flex:1;color:#1d1d1f;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dv-scroll-coord{color:#86868b;font-size:10px;font-variant-numeric:tabular-nums}

/* ── Map tooltip ── */
.deck-tooltip{font-family:'Inter',sans-serif;background:rgba(255,255,255,.92)!important;backdrop-filter:blur(10px)!important;border:1px solid rgba(0,0,0,.08)!important;border-radius:8px!important;color:#1d1d1f!important;font-size:12px!important;padding:8px 12px!important;box-shadow:0 4px 16px rgba(0,0,0,.08)!important}

/* ── Pulse dot ── */
.dv-pulse{width:8px;height:8px;border-radius:50%;background:#34c759;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(52,199,89,.4)}50%{box-shadow:0 0 0 6px rgba(52,199,89,0)}}

/* ── Fade-in animation ── */
.dv-card{animation:fadeUp .6s ease-out both}
.dv-left .dv-card:nth-child(1){animation-delay:.1s}
.dv-left .dv-card:nth-child(2){animation-delay:.2s}
.dv-left .dv-card:nth-child(3){animation-delay:.3s}
.dv-right .dv-card:nth-child(1){animation-delay:.15s}
.dv-right .dv-card:nth-child(2){animation-delay:.25s}
.dv-right .dv-card:nth-child(3){animation-delay:.35s}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* ── Mobile viewport overrides (<= 768px) ── */
@media (max-width: 768px) {
    .dv-root {
        display: flex !important;
        flex-direction: column !important;
        height: auto !important;
        width: 100vw !important;
        overflow-y: auto !important;
        background: #f5f5f7;
    }
    
    .dv-header {
        order: 1 !important;
        height: auto !important;
        flex-direction: column !important;
        align-items: flex-start !important;
        padding: 16px 20px !important;
        gap: 12px !important;
        flex-shrink: 0 !important;
    }
    .dv-header h1 {
        font-size: 16px !important;
    }
    .dv-header-right {
        width: 100% !important;
        justify-content: space-between !important;
        gap: 10px !important;
    }
    
    .dv-center {
        order: 2 !important;
        height: 380px !important;
        width: calc(100% - 24px) !important;
        margin: 12px !important;
        border-radius: 14px !important;
        border: 1px solid rgba(0,0,0,.06) !important;
        flex-shrink: 0 !important;
    }
    
    .dv-left {
        order: 3 !important;
        padding: 12px 12px 0 12px !important;
        gap: 12px !important;
        overflow: visible !important;
        height: auto !important;
        flex: none !important;
    }
    
    .dv-right {
        order: 4 !important;
        padding: 12px !important;
        gap: 12px !important;
        overflow: visible !important;
        height: auto !important;
        flex: none !important;
    }
    
    .dv-footer {
        order: 5 !important;
        display: grid !important;
        grid-template-columns: repeat(2, 1fr) !important;
        gap: 12px !important;
        padding: 16px !important;
        height: auto !important;
        border-top: 1px solid rgba(0,0,0,.06) !important;
        background: #fff !important;
        flex-shrink: 0 !important;
    }
    .dv-footer-sep {
        display: none !important;
    }
    .dv-footer-item {
        text-align: left !important;
        padding: 8px 12px !important;
        background: rgba(0, 113, 227, 0.03) !important;
        border-radius: 8px !important;
        border: 1px solid rgba(0, 113, 227, 0.06) !important;
    }
    
    .dv-card {
        flex: none !important;
        height: auto !important;
        min-height: 200px !important;
    }
    
    /* ECharts and list container safety sizes on mobile */
    .dv-chart {
        height: 180px !important;
    }
    .dv-scroll-wrap {
        height: 220px !important;
    }
}
</style>
</head>
<body>
<div class="dv-root">

<!-- ═══ HEADER ═══ -->
<div class="dv-header">
  <div>
    <h1>🏙️ /*__SITE_NAME__*/微更新决策支持平台</h1>
    <div class="dv-header-sub">UltimateDESIGN · 全域数据监控看板</div>
  </div>
  <div class="dv-header-right">
    <span class="dv-header-badge">LIVE DASHBOARD</span>
    <div class="dv-pulse"></div>
    <div class="dv-clock" id="dv-clock">--:--:--</div>
  </div>
</div>

<!-- ═══ LEFT PANEL ═══ -->
<div class="dv-left">
  <!-- KPI 卡片 -->
  <div class="dv-card" style="flex:0 0 auto">
    <div class="dv-card-title">核心指标</div>
    <div class="dv-kpi-row">
      <div>
        <div class="dv-kpi"><span class="dv-kpi-value" data-target="boundary_ha">--</span><span class="dv-kpi-unit">公顷</span></div>
        <div class="dv-kpi-label">研究范围面积</div>
      </div>
      <div>
        <div class="dv-kpi"><span class="dv-kpi-value" data-target="building_count">--</span><span class="dv-kpi-unit">栋</span></div>
        <div class="dv-kpi-label">测区建筑总数</div>
      </div>
    </div>
    <div class="dv-kpi-row" style="margin-top:10px">
      <div>
        <div class="dv-kpi"><span class="dv-kpi-value" data-target="poi_count">--</span><span class="dv-kpi-unit">处</span></div>
        <div class="dv-kpi-label">POI 设施点位</div>
      </div>
      <div>
        <div class="dv-kpi"><span class="dv-kpi-value" data-target="gvi_count">--</span><span class="dv-kpi-unit">个</span></div>
        <div class="dv-kpi-label">街景采样点</div>
      </div>
    </div>
  </div>

  <!-- 建筑高度分布 -->
  <div class="dv-card">
    <div class="dv-card-title">建筑高度分布</div>
    <div class="dv-chart" id="chart-heights"></div>
  </div>

  <!-- 天际线指标 -->
  <div class="dv-card" style="flex:0 0 auto">
    <div class="dv-card-title">天际线形态指标</div>
    <div class="dv-kpi-row">
      <div>
        <div class="dv-kpi"><span class="dv-kpi-value" data-target="max_height">--</span><span class="dv-kpi-unit">m</span></div>
        <div class="dv-kpi-label">🏙️ 地标最大高度</div>
      </div>
      <div>
        <div class="dv-kpi"><span class="dv-kpi-value" data-target="avg_height">--</span><span class="dv-kpi-unit">m</span></div>
        <div class="dv-kpi-label">🏢 平均建筑高度</div>
      </div>
    </div>
    <div style="margin-top:8px">
      <div class="dv-kpi"><span class="dv-kpi-value" data-target="high_rise_ratio">--</span><span class="dv-kpi-unit">%</span></div>
      <div class="dv-kpi-label">📈 高层建筑占比 (≥24m)</div>
    </div>
  </div>
</div>

<!-- ═══ CENTER MAP ═══ -->
<div class="dv-center" id="map-container"></div>

<!-- ═══ RIGHT PANEL ═══ -->
<div class="dv-right">
  <!-- 用地类型 -->
  <div class="dv-card">
    <div class="dv-card-title">用地类型构成</div>
    <div class="dv-chart" id="chart-landuse"></div>
  </div>

  <!-- POI 滚动列表 -->
  <div class="dv-card" style="flex:1.2">
    <div class="dv-card-title">POI 设施实时数据流</div>
    <div class="dv-scroll-wrap">
      <div class="dv-scroll-inner" id="poi-scroll"></div>
    </div>
  </div>
</div>

<!-- ═══ FOOTER ═══ -->
<div class="dv-footer">
  <div class="dv-footer-item"><div class="dv-footer-val" data-target="boundary_ha">--</div><div class="dv-footer-label">研究面积 (公顷)</div></div>
  <div class="dv-footer-sep"></div>
  <div class="dv-footer-item"><div class="dv-footer-val" data-target="building_count">--</div><div class="dv-footer-label">建筑总数 (栋)</div></div>
  <div class="dv-footer-sep"></div>
  <div class="dv-footer-item"><div class="dv-footer-val" data-target="poi_count">--</div><div class="dv-footer-label">POI 点位 (处)</div></div>
  <div class="dv-footer-sep"></div>
  <div class="dv-footer-item"><div class="dv-footer-val" data-target="gvi_count">--</div><div class="dv-footer-label">街景采样 (个)</div></div>
  <div class="dv-footer-sep"></div>
  <div class="dv-footer-item"><div class="dv-footer-val" data-target="max_height">--</div><div class="dv-footer-label">地标高度 (m)</div></div>
  <div class="dv-footer-sep"></div>
  <div class="dv-footer-item"><div class="dv-footer-val" data-target="avg_height">--</div><div class="dv-footer-label">平均层高 (m)</div></div>
</div>

</div><!-- end dv-root -->

<script>
// ═══ Data Injection ═══
const DV_STATS = /*__DV_STATS__*/null/*__END__*/;
const DV_BOUNDARY = /*__DV_BOUNDARY__*/null/*__END__*/;
const DV_PLOTS = /*__DV_PLOTS__*/null/*__END__*/;
const DV_BUILDING_URL = /*__DV_BUILDING_URL__*/null/*__END__*/;
const DV_MAP_CONFIG = /*__DV_MAP_CONFIG__*/{"center": [125.34064, 43.90095], "zoom": 14.4, "pitch": 65.0, "bearing": 30.0}/*__END_MAP_CONFIG__*/;


// ═══ Clock ═══
function tickClock(){
  const now=new Date();
  const h=String(now.getHours()).padStart(2,'0');
  const m=String(now.getMinutes()).padStart(2,'0');
  const s=String(now.getSeconds()).padStart(2,'0');
  document.getElementById('dv-clock').textContent=h+':'+m+':'+s;
}
setInterval(tickClock,1000);tickClock();

// ═══ CountUp Animation ═══
function countUp(el,target,decimals){
  if(isNaN(target)){el.textContent=target;return}
  const dur=1500;const start=performance.now();
  const fmt=v=>decimals>0?v.toFixed(decimals):Math.round(v).toLocaleString();
  function step(ts){
    const p=Math.min((ts-start)/dur,1);
    const ease=1-Math.pow(1-p,3);
    el.textContent=fmt(target*ease);
    if(p<1)requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

if(DV_STATS){
  document.querySelectorAll('[data-target]').forEach(el=>{
    const key=el.dataset.target;
    const val=DV_STATS[key];
    if(val===undefined||val===null||val==='N/A'){el.textContent=val||'--';return}
    const num=parseFloat(val);
    if(!isNaN(num)){
      const dec=String(val).includes('.')?1:0;
      setTimeout(()=>countUp(el,num,dec),300);
    }else{el.textContent=val}
  });
}

// ═══ Map ═══
(function initMap(){
  const layers=[];

  // Building layer
  if(DV_BUILDING_URL){
    let fetchUrl=DV_BUILDING_URL;
    try{const o=new URL(document.referrer||window.location.href).origin;if(fetchUrl.startsWith('/')&&!fetchUrl.startsWith('//'))fetchUrl=o+fetchUrl}catch(e){}
    layers.push(new deck.GeoJsonLayer({
      id:'building',data:fetchUrl,opacity:.9,stroked:true,filled:true,extruded:true,wireframe:true,
      getElevation:d=>{const p=d.properties||{};const f=parseFloat(p.Floor||p.levels||1);return f*3.5},
      getFillColor:[255,255,255,230],getLineColor:[200,200,204,180],lineWidthMinPixels:1,
      pickable:true,shadowEnabled:true,
      transitions:{getElevation:{duration:2000,easing:t=>t*t*(3-2*t)}},
      fetch:url=>fetch(url).then(r=>r.status===404&&url.includes('/app/')?fetch(url.replace('/app/','/')):r).then(r=>r.json())
    }));
  }

  // Boundary
  if(DV_BOUNDARY){
    layers.push(new deck.GeoJsonLayer({
      id:'boundary',data:DV_BOUNDARY,stroked:true,filled:true,
      getFillColor:[220,38,38,15],getLineColor:[220,38,38,200],getLineWidth:4,lineWidthMinPixels:2,pickable:false
    }));
  }

  // Plots
  if(DV_PLOTS){
    layers.push(new deck.GeoJsonLayer({
      id:'plots',data:DV_PLOTS,stroked:true,filled:true,extruded:false,
      getFillColor:[255,59,48,18],getLineColor:[255,59,48,180],getLineWidth:3,pickable:true
    }));
  }

  // Lighting
  const ambient=new deck.AmbientLight({color:[255,255,255],intensity:1.0});
  const sun=new deck._SunLight({timestamp:Date.UTC(2026,3,20,2,0,0),color:[255,245,230],intensity:2.2,_shadow:false});
  const lighting=new deck.LightingEffect({ambient,sun});

  let viewState={latitude:DV_MAP_CONFIG.center[1],longitude:DV_MAP_CONFIG.center[0],zoom:DV_MAP_CONFIG.zoom,pitch:DV_MAP_CONFIG.pitch,bearing:DV_MAP_CONFIG.bearing};
  let rotating=true;

  const deckgl=new deck.DeckGL({
    container:'map-container',
    mapStyle:'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json',
    glOptions:{antialias:true,preserveDrawingBuffer:true,powerPreference:'high-performance'},
    useDevicePixels:true,effects:[lighting],viewState:viewState,
    controller:{dragRotate:true,dragPan:true,scrollZoom:{speed:.003,smooth:true}},
    onViewStateChange:({viewState:vs})=>{viewState=vs;rotating=false;deckgl.setProps({viewState:vs});return vs},
    layers:layers,
    getTooltip:({object,layer})=>{
      if(!object||!layer)return null;
      const p=object.properties||{};
      if(layer.id==='building'){
        const f=parseFloat(p.Floor||p.levels||1);
        return{html:'<b>🏢 '+f+'F / '+(f*3.5).toFixed(1)+'m</b>'}
      }
      if(layer.id==='plots')return{html:'<b>🏗️ 重点地块: '+(p.Name||p.name||'未命名')+'</b>'};
      return null;
    }
  });

  // Auto-rotate
  function rotate(){
    if(rotating){
      viewState={...viewState,bearing:(viewState.bearing+.03)%360,latitude:DV_MAP_CONFIG.center[1],longitude:DV_MAP_CONFIG.center[0]};
      deckgl.setProps({viewState:viewState});
    }
    requestAnimationFrame(rotate);
  }
  requestAnimationFrame(rotate);

  // Click to resume rotation
  document.getElementById('map-container').addEventListener('dblclick',()=>{
    rotating=true;
    viewState={...viewState,latitude:DV_MAP_CONFIG.center[1],longitude:DV_MAP_CONFIG.center[0],zoom:DV_MAP_CONFIG.zoom,pitch:DV_MAP_CONFIG.pitch,bearing:viewState.bearing,
      transitionDuration:1500,transitionInterpolator:new deck.FlyToInterpolator()};
    deckgl.setProps({viewState:viewState});
  });
})();

// ═══ ECharts: Building Heights ═══
if(DV_STATS&&DV_STATS.height_chart&&DV_STATS.height_chart.length>0){
  const el=document.getElementById('chart-heights');
  const ch=echarts.init(el);
  ch.setOption({
    grid:{left:40,right:12,top:8,bottom:24},
    xAxis:{type:'category',data:DV_STATS.height_chart.map(d=>d.name),
      axisLine:{lineStyle:{color:'rgba(0,0,0,.08)'}},axisLabel:{fontSize:10,color:'#86868b'},axisTick:{show:false}},
    yAxis:{type:'value',splitLine:{lineStyle:{color:'rgba(0,0,0,.04)'}},axisLabel:{fontSize:10,color:'#86868b'},axisLine:{show:false}},
    series:[{type:'bar',data:DV_STATS.height_chart.map(d=>d.value),barWidth:'55%',
      itemStyle:{borderRadius:[4,4,0,0],color:new echarts.graphic.LinearGradient(0,0,0,1,[
        {offset:0,color:'#0071e3'},{offset:1,color:'rgba(0,113,227,.3)'}
      ])},
      emphasis:{itemStyle:{color:'#0071e3'}}
    }],
    tooltip:{trigger:'axis',backgroundColor:'rgba(255,255,255,.95)',borderColor:'rgba(0,0,0,.08)',textStyle:{color:'#1d1d1f',fontSize:12}}
  });
  new ResizeObserver(()=>ch.resize()).observe(el);
}

// ═══ ECharts: Landuse ═══
if(DV_STATS&&DV_STATS.landuse_chart&&DV_STATS.landuse_chart.length>0){
  const el=document.getElementById('chart-landuse');
  const ch=echarts.init(el);
  const colors=['#0071e3','#34c759','#af52de','#ff9500','#ff3b30','#5ac8fa','#6366f1','#ec4899'];
  ch.setOption({
    tooltip:{trigger:'item',backgroundColor:'rgba(255,255,255,.95)',borderColor:'rgba(0,0,0,.08)',textStyle:{color:'#1d1d1f',fontSize:11}},
    series:[{type:'pie',radius:['40%','72%'],center:['50%','50%'],
      data:DV_STATS.landuse_chart,avoidLabelOverlap:true,
      itemStyle:{borderRadius:4,borderColor:'#fff',borderWidth:2,
        color:function(p){return colors[p.dataIndex%colors.length]}},
      label:{fontSize:10,color:'#48484a',formatter:'{b}\n{d}%'},
      emphasis:{label:{fontSize:12,fontWeight:'bold'}},
      animationType:'scale',animationEasing:'elasticOut'
    }]
  });
  new ResizeObserver(()=>ch.resize()).observe(el);
}

// ═══ POI Scroll List ═══
if(DV_STATS&&DV_STATS.poi_list&&DV_STATS.poi_list.length>0){
  const wrap=document.getElementById('poi-scroll');
  const list=DV_STATS.poi_list;
  let html='';
  // Duplicate for seamless scroll
  for(let r=0;r<2;r++){
    list.forEach((p,i)=>{
      html+='<div class="dv-scroll-row">'
        +'<span class="dv-scroll-idx">'+(i+1)+'</span>'
        +'<span class="dv-scroll-name">'+(p.Name||'未知设施')+'</span>'
        +'<span class="dv-scroll-coord">'+Number(p.Lng).toFixed(3)+', '+Number(p.Lat).toFixed(3)+'</span>'
        +'</div>';
    });
  }
  wrap.innerHTML=html;
}
</script>
</body>
</html>
